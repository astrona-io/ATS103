# Wire A Release Pipeline End To End
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-103-capstone-030"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-harbor"
      description: "Installs Helm 3.22.1, the CoreDNS rewrites, Harbor 2.15.4 and a minimal Dragonfly 2.5.2, the workstation pod, the mirror registry and the project inventory with podinfo"
      type: "file"
      source: "bootstrap/01-install-harbor.sh"
    - name: "ats-103-capstone-030-setup"
      description: "Creates a manual replication rule, a disabled preheat instance on the wrong port and a manual preheat policy that selects every tag"
      type: "file"
      source: "bootstrap/02-seed-state.sh"

testing:
  init:
    - name: "wait-for-harbor"
      description: "Waits until Harbor reports every component healthy and the workstation trusts its CA"
      type: "file"
      source: "testing/wait-for-harbor.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-replication-rule"
      description: "Confirms release-to-mirror is the original rule, enabled and event based"
      type: "file"
      source: "validation/validate-replication-rule.sh"
    - name: "validate-release-replicated"
      description: "Pushes a new release tag and confirms it reaches the mirror"
      type: "file"
      source: "validation/validate-release-replicated.sh"
    - name: "validate-instance"
      description: "Confirms the original instance dragonfly points at the manager, is enabled and is reachable"
      type: "file"
      source: "validation/validate-instance.sh"
    - name: "validate-policy"
      description: "Confirms the original release-preheat preheats only release tags on push"
      type: "file"
      source: "validation/validate-policy.sh"

teardown:
  keepCluster: false
