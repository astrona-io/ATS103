# Preheat Release Tags With Dragonfly
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-103-lab-030-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-harbor"
      description: "Installs Helm 3.22.1, the CoreDNS rewrites, Harbor 2.15.4 and a minimal Dragonfly 2.5.2, the workstation pod, the mirror registry and the project inventory with podinfo"
      type: "file"
      source: "bootstrap/01-install-harbor.sh"
    - name: "ats-103-lab-030-01-setup"
      description: "Checks that the Dragonfly manager answers; no P2P provider instance or preheat policy exists"
      type: "file"
      source: "bootstrap/02-seed-state.sh"

testing:
  init:
    - name: "wait-for-harbor"
      description: "Waits until Harbor reports every component healthy and the workstation trusts its CA"
      type: "file"
      source: "testing/wait-for-harbor.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-instance"
      description: "Confirms the instance dragonfly points at the Dragonfly manager, is enabled and is reachable"
      type: "file"
      source: "validation/validate-instance.sh"
    - name: "validate-policy"
      description: "Confirms release-preheat preheats only release tags of inventory on push, through dragonfly"
      type: "file"
      source: "validation/validate-policy.sh"

teardown:
  keepCluster: false
