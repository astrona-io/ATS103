# Schedule Nightly Preheating
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-103-lab-030-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-harbor"
      description: "Installs Helm 3.22.1, the CoreDNS rewrites, Harbor 2.15.4 and a minimal Dragonfly 2.5.2, the workstation pod, the mirror registry and the project inventory with podinfo"
      type: "file"
      source: "bootstrap/01-install-harbor.sh"
    - name: "ats-103-lab-030-02-setup"
      description: "Checks that the Dragonfly manager answers and registers the P2P provider instance dragonfly; no preheat policy exists"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-harbor"
      description: "Waits until Harbor reports every component healthy and the workstation trusts its CA"
      type: "file"
      source: "testing/wait-for-harbor.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-schedule"
      description: "Confirms nightly-preheat is enabled, uses dragonfly and runs at 02:00 every day"
      type: "file"
      source: "validation/validate-schedule.sh"
    - name: "validate-selection"
      description: "Confirms nightly-preheat selects only release tags"
      type: "file"
      source: "validation/validate-selection.sh"
    - name: "validate-manual-run"
      description: "Confirms nightly-preheat has been started by hand at least once"
      type: "file"
      source: "validation/validate-manual-run.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
      - docker.io/goharbor/harbor-core:v2.15.4
      - docker.io/goharbor/harbor-db:v2.15.4
      - docker.io/goharbor/harbor-jobservice:v2.15.4
      - docker.io/goharbor/harbor-portal:v2.15.4
      - docker.io/goharbor/harbor-registryctl:v2.15.4
      - docker.io/goharbor/nginx-photon:v2.15.4
      - docker.io/goharbor/registry-photon:v2.15.4
      - docker.io/goharbor/trivy-adapter-photon:v2.15.4
      - docker.io/valkey/valkey:8.1.10-alpine
      - mysql:8.4.13
      - redis:7.4.11-alpine
      - registry:3.1.2
