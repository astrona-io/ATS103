# Replicate Release Tags To A Mirror
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-103-lab-010-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-harbor"
      description: "Installs Helm 3.22.1, the CoreDNS rewrites, Harbor 2.15.4, the workstation pod, the mirror registry and the project inventory with podinfo"
      type: "file"
      source: "bootstrap/01-install-harbor.sh"
    - name: "ats-103-lab-010-01-setup"
      description: "Creates the registry endpoint mirror; no replication rule exists"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-harbor"
      description: "Waits until Harbor reports every component healthy and the workstation trusts its CA"
      type: "file"
      source: "testing/wait-for-harbor.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-rule-configured"
      description: "Confirms the rule release-to-mirror exists, is enabled, is event based and pushes to the endpoint mirror"
      type: "file"
      source: "validation/validate-rule-configured.sh"
    - name: "validate-release-replicated"
      description: "Pushes a new release tag and confirms it reaches the mirror"
      type: "file"
      source: "validation/validate-release-replicated.sh"
    - name: "validate-dev-not-replicated"
      description: "Pushes a non-release tag and confirms it stays in Harbor"
      type: "file"
      source: "validation/validate-dev-not-replicated.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
      - docker.io/goharbor/harbor-core:v2.15.4
      - docker.io/goharbor/harbor-db:v2.15.4
      - docker.io/goharbor/harbor-jobservice:v2.15.4
      - docker.io/goharbor/harbor-portal:v2.15.4
      - docker.io/goharbor/harbor-registryctl:v2.15.4
      - docker.io/goharbor/nginx-photon:v2.15.4
      - docker.io/goharbor/registry-photon:v2.15.4
      - docker.io/goharbor/trivy-adapter-photon:v2.15.4
      - docker.io/valkey/valkey:8.1.10-alpine
      - registry:3.1.2
