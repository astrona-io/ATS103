# Pull Vendor Images On A Schedule
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-103-lab-010-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-harbor"
      description: "Installs Helm 3.22.1, the CoreDNS rewrites, Harbor 2.15.4, the workstation pod, the mirror registry and the project inventory with podinfo"
      type: "file"
      source: "bootstrap/01-install-harbor.sh"
    - name: "ats-103-lab-010-02-setup"
      description: "Creates the registry endpoint mirror, the project vendored and the mirror content; no replication rule exists"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-harbor"
      description: "Waits until Harbor reports every component healthy and the workstation trusts its CA"
      type: "file"
      source: "testing/wait-for-harbor.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-rule-configured"
      description: "Confirms pull-vendor-tools is an enabled, scheduled pull rule from the endpoint mirror with the hourly cron expression"
      type: "file"
      source: "validation/validate-rule-configured.sh"
    - name: "validate-pulled-tags"
      description: "Starts the rule and confirms 1.0.0 and 1.1.0 arrive in vendored/tools and nightly does not"
      type: "file"
      source: "validation/validate-pulled-tags.sh"
    - name: "validate-only-tools"
      description: "Confirms vendor/debug is not pulled and the path is vendored/tools"
      type: "file"
      source: "validation/validate-only-tools.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
      - docker.io/goharbor/harbor-core:v2.15.4
      - docker.io/goharbor/harbor-db:v2.15.4
      - docker.io/goharbor/harbor-jobservice:v2.15.4
      - docker.io/goharbor/harbor-portal:v2.15.4
      - docker.io/goharbor/harbor-registryctl:v2.15.4
      - docker.io/goharbor/nginx-photon:v2.15.4
      - docker.io/goharbor/registry-photon:v2.15.4
      - docker.io/goharbor/trivy-adapter-photon:v2.15.4
      - docker.io/valkey/valkey:8.1.10-alpine
      - registry:3.1.2
